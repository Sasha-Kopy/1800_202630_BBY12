<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - PaceMoney</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-5" style="max-width: 420px;">
        <a href="index.html" class="d-inline-block mb-4 text-decoration-none">&larr; Back to PaceMoney</a>

        <!-- Alerts -->
        <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

        <div id="signupView">
            <h3 class="mb-3 text-center">Sign Up</h3>
            <form id="signupForm" novalidate>
                <div class="mb-3">
                    <input type="text" id="signupName" autocomplete="name" class="form-control"
                        placeholder="First and Last Name" aria-label="Full name" required />
                </div>
                <div class="mb-3">
                    <input type="email" id="signupEmail" autocomplete="email" class="form-control" placeholder="Email"
                        aria-label="Email" required />
                </div>
                <div class="mb-3">
                    <input type="password" id="signupPassword" autocomplete="new-password" minlength="6"
                        class="form-control" placeholder="Password (at least 6 characters)" aria-label="Password"
                        required />
                </div>
                <button type="submit" class="btn btn-success w-100">Create account</button>
            </form>
            <small class="d-block mt-3 text-center">
                Already have an account?
                <a href="login.html">Log in</a>
            </small>
        </div>
    </div>
    <script type="module" src="./src/signup.js"></script>
</body>

</html>
