<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - PaceMoney</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="./images/budget.png" height="36" alt="">PaceMoney
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Savings (coming soon)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Budget (coming soon)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="settings.html">Settings</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4" style="max-width: 720px;">
        <h2 class="mb-4">Dashboard</h2>

        <div id="expenseAlert" class="alert alert-danger d-none" role="alert"></div>

        <!-- Add expense -->
        <div class="card shadow-sm p-4 mb-4">
            <h3 class="h5 mb-3">Add an expense</h3>
            <form id="expenseForm" novalidate>
                <div class="mb-3">
                    <label for="expenseDesc" class="form-label">What did you spend on?</label>
                    <input type="text" id="expenseDesc" class="form-control" maxlength="100" required>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label for="expenseAmount" class="form-label">Amount ($)</label>
                        <input type="number" id="expenseAmount" class="form-control" step="0.01" min="0.01" required>
                    </div>
                    <div class="col-sm-6">
                        <label for="expenseDate" class="form-label">Date</label>
                        <input type="date" id="expenseDate" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Add expense</button>
            </form>
        </div>

        <!-- Expenses for the selected date -->
        <div class="card shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-baseline mb-3">
                <h3 id="expenseListHeading" class="h5 mb-0">Today's expenses</h3>
                <span class="fw-semibold">Total: $<span id="expenseTotal">0.00</span></span>
            </div>
            <ul id="expenseList" class="list-group list-group-flush"></ul>
        </div>
    </div>

    <script type="module" src="./src/dashboard.js"></script>

</body>

</html>
