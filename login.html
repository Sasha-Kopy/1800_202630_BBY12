<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In - PaceMoney</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-5" style="max-width: 420px;">
        <a href="index.html" class="d-inline-block mb-4 text-decoration-none">&larr; Back to PaceMoney</a>

        <!-- Alerts -->
        <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

        <div id="loginView">
            <h3 class="mb-3 text-center">Log in</h3>
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <input type="email" id="loginEmail" autocomplete="email" class="form-control" placeholder="Email"
                        aria-label="Email" required />
                </div>
                <div class="mb-3">
                    <input type="password" id="loginPassword" autocomplete="current-password" class="form-control"
                        placeholder="Password" aria-label="Password" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>
            <small class="d-block mt-3 text-center">
                Don&rsquo;t have an account?
                <a href="signup.html">Sign up</a>
            </small>
        </div>
    </div>
    <script type="module" src="./src/login.js"></script>
</body>

</html>
