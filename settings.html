<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile & Settings - PaceMoney</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
                <img src="./images/budget.png" height="36" alt="PaceMoney Logo">PaceMoney
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="Savings.html">Savings</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Budget</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="settings.html">Settings</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Feedback toast (filled in by src/settings.js) -->
    <div id="settingsToast" class="alert d-none position-fixed bottom-0 start-50 translate-middle-x mb-3 shadow" role="status" style="z-index:1080"></div>

    <div class="container py-5">
        <div class="row g-4 justify-content-center">

            <!-- Profile summary -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm text-center p-4">
                    <div class="position-relative d-inline-block mx-auto mb-3">
                        <img id="profileImage" alt="User avatar" width="120" height="120"
                            class="rounded-circle border border-3 border-success object-fit-cover"
                            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%23e6f2ee'/%3E%3Ccircle cx='60' cy='46' r='22' fill='%231b6b57'/%3E%3Cpath d='M16 120c0-26 20-42 44-42s44 16 44 42z' fill='%231b6b57'/%3E%3C/svg%3E">
                        <label for="avatarUpload" class="btn btn-sm btn-success rounded-circle position-absolute bottom-0 end-0"
                            title="Change Profile Picture">
                            <i class="bi bi-camera-fill"></i>
                        </label>
                        <input type="file" id="avatarUpload" class="d-none" accept="image/*">
                    </div>

                    <h4 id="displayNameHeader" class="fw-bold mb-1">Loading...</h4>
                    <p id="displayEmailHeader" class="text-muted small mb-3"></p>

                    <div class="d-flex justify-content-center gap-2 mb-3">
                        <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
                            <i class="bi bi-shield-check me-1"></i>Active Budgeter
                        </span>
                    </div>

                    <hr class="my-3">

                    <div class="row text-center">
                        <div class="col-6 border-end">
                            <small class="text-muted d-block">Monthly Budget</small>
                            <span id="summaryBudgetLimit" class="fw-bold text-dark">Not set</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted d-block">Savings Target</small>
                            <span id="summarySavingsGoal" class="fw-bold text-success">Not set</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <!-- Profile details -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h5 class="mb-0 fw-semibold"><i class="bi bi-person-gear me-2 text-success"></i>Profile Details</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="personalInfoForm" novalidate>
                            <fieldset id="personalInfoFields" disabled>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="nameInput" class="form-label fw-medium">Full Name</label>
                                        <input type="text" class="form-control" id="nameInput" placeholder="Enter your name" maxlength="60">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="emailInput" class="form-label fw-medium">Email Address</label>
                                        <input type="email" class="form-control" id="emailInput" readonly>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="cityInput" class="form-label fw-medium">City</label>
                                        <input type="text" class="form-control" id="cityInput" placeholder="e.g., Vancouver" maxlength="60">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="currencySelect" class="form-label fw-medium">Preferred Currency</label>
                                        <select class="form-select" id="currencySelect">
                                            <option value="CAD" selected>CAD ($)</option>
                                            <option value="USD">USD ($)</option>
                                            <option value="EUR">EUR (€)</option>
                                            <option value="GBP">GBP (£)</option>
                                        </select>
                                    </div>
                                </div>
                            </fieldset>
                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <button type="button" id="editButton" class="btn btn-outline-secondary">
                                    <i class="bi bi-pencil me-1"></i>Edit Profile
                                </button>
                                <button type="button" id="saveButton" class="btn btn-success d-none">
                                    <i class="bi bi-check-lg me-1"></i>Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Budget preferences -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h5 class="mb-0 fw-semibold"><i class="bi bi-sliders me-2 text-success"></i>Budget Preferences</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="budgetPrefsForm" novalidate>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="monthlyBudgetInput" class="form-label fw-medium">Monthly Budget</label>
                                    <div class="input-group">
                                        <span class="input-group-text currency-symbol">$</span>
                                        <input type="number" class="form-control" id="monthlyBudgetInput" placeholder="e.g. 2000" min="0" step="0.01" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="savingsTargetInput" class="form-label fw-medium">Monthly Savings Target</label>
                                    <div class="input-group">
                                        <span class="input-group-text currency-symbol">$</span>
                                        <input type="number" class="form-control" id="savingsTargetInput" placeholder="e.g. 500" min="0" step="0.01" required>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                                <button type="button" id="logoutButton" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-box-arrow-right me-1"></i>Log Out
                                </button>
                                <button type="submit" id="savePrefsButton" class="btn btn-success">Update Preferences</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="./src/settings.js"></script>
</body>

</html>
