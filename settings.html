<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings - PaceMoney</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="./images/budget.png" height="36" alt="">PaceMoney
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Savings (coming soon)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Budget (coming soon)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="settings.html">Settings</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h2 class="mb-4 text-center">User Settings</h2>
                    <form id="settingsForm">
                        <div class="mb-3">
                            <label for="dailyLimitInput" class="form-label">Daily Expense Limit ($)</label>
                            <input type="number" step="0.01" class="form-control" id="dailyLimitInput" required min="0">
                        </div>
                        <div class="mb-3">
                            <label for="savingsGoalInput" class="form-label">Target Savings Goal ($)</label>
                            <input type="number" step="0.01" class="form-control" id="savingsGoalInput" required min="0">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save changes</button>
                    </form>
                    <div id="statusMessage" class="mt-3 text-center" role="status" aria-live="polite"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./src/settings.js"></script>

</body>

</html>
