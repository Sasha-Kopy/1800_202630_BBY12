<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Savings - PaceMoney</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script>document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));</script>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="./images/budget.png" height="36" alt="">PaceMoney
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="Savings.html">Savings</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="settings.html">Settings</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container px-4 py-5">
        <h2 class="pb-2 border-bottom">Savings</h2>

        <div id="savingsAlert" class="alert alert-danger d-none" role="alert"></div>

        <h4 class="fs-5 mt-4 mb-3">Last 7 days</h4>
        <ul class="list-group mb-4" id="daily-list" style="max-width: 720px;"></ul>

        <p class="mb-1">Total spent: <strong>$<span id="week-total">0.00</span></strong></p>
        <p class="mb-3">Saved by skipping: <strong>$<span id="saved-total">0.00</span></strong></p>

        <div style="max-width: 720px;">
            <canvas id="spending-chart"></canvas>
        </div>
    </div>

    <script type="module" src="./src/Savings.js"></script>
    <script type="module" src="./src/theme.js"></script>
</body>

</html>
