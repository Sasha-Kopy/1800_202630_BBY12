<!DOCTYPE html>
<html lang="en">

<head>
    <title>Home - PaceMoney</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
           <span class="navbar-brand d-flex align-items-center gap-2">
                <img src="./images/budget.png" height="36" alt="">PaceMoney
            </span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Savings.html">Savings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Budget</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="settings.html">Settings</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container px-4 py-5">
        <h2 class="pb-2 border-bottom">Home</h2>
        <p id="today-date" class="fs-5 text-muted mt-3 mb-0"></p>

        <div id="homeAlert" class="alert alert-danger d-none" role="alert"></div>

        <!-- Progress toward the savings goal set in Settings (money saved by skipping items) -->
        <div class="my-4">
            <h4 class="fs-5 mb-2">Progress to Goal</h4>
            <div class="progress position-relative" style="height: 28px;" role="progressbar"
                aria-label="Progress to Goal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
                id="progress-wrapper">
                <div class="progress-bar" id="progress-bar" style="width: 0%; transition: width .3s;"></div>
                <span id="progress-text"
                    class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center fw-bold text-dark">0%</span>
            </div>
            <p id="progress-caption" class="small text-muted mt-2 mb-0" role="status" aria-live="polite"></p>
        </div>

        <!-- Today's items: your quick-add items from the Dashboard (filled in by src/Savingsprogress.js) -->
        <div id="daily-items" class="row row-cols-1"></div>
    </div>

    <script type="module" src="./src/Savingsprogress.js"></script>
</body>

</html>
